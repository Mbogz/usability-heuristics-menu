<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usability Heuristics Menu</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <h1>Usability Heuristics Menu</h1>
  <div class="menu-container">
    <div class="menu-item" data-detail="Spotify">
        <i class="fa-brands fa-spotify"></i>
      </div>
      <div class="menu-item" data-detail="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </div>
      <div class="menu-item" data-detail="GitHub">
        <i class="fab fa-github"></i>
      </div>
      <div class="menu-item" data-detail="Google">
        <i class="fa-brands fa-google"></i>
      </div>
      <div class="menu-item" data-detail="Discord">
        <i class="fa-brands fa-discord"></i>
      </div>
      <div class="menu-item" data-detail="LinkedIn">
        <i class="fa-brands fa-linkedin"></i>
      </div>
      <div class="menu-item" data-detail="Twitter">
        <i class="fa-brands fa-x-twitter"></i>
      </div>
      <div class="menu-item" data-detail="Tiktok">
        <i class="fa-brands fa-tiktok"></i>
      </div>
      <div class="menu-item" data-detail="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </div>
      <div class="menu-item" data-detail="Snapchat">
        <i class="fa-brands fa-snapchat"></i>
      </div>
    
  </div>

  <script src="script.js"></script>
</body>
</html>
